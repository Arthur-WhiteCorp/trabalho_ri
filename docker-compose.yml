services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  indexador:
    build: .
    container_name: indexador
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./colecao:/app/colecao
      - shared_signals:/app  # Volume compartilhado para arquivos de sinal
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    networks:
      - elastic
    command: python main.py

  flask-app:
    build: .
    container_name: flask-app
    depends_on:
      indexador:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    volumes:
      - ./colecao:/app/colecao
      - ./analysers:/app/analysers
      - shared_signals:/app  # Volume compartilhado para arquivos de sinal
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    networks:
      - elastic
    command: python start_flask.py

volumes:
  elasticsearch_data:
  shared_signals:  # Volume para compartilhar arquivos de sinal entre containers

networks:
  elastic:
    driver: bridge
