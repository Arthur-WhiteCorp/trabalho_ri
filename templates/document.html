<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalhes do Documento</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        background: white;
        border-radius: 15px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        position: relative;
      }

      .back-button {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
        font-size: 14px;
        transition: background 0.3s;
      }

      .back-button:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      .header h1 {
        font-size: 2em;
        margin-bottom: 10px;
        text-align: center;
      }

      .header p {
        font-size: 1.1em;
        opacity: 0.9;
        text-align: center;
      }

      .loading {
        text-align: center;
        padding: 60px;
        color: #6c757d;
        font-size: 1.2em;
      }

      .error {
        background: #f8d7da;
        color: #721c24;
        padding: 20px;
        border-radius: 10px;
        margin: 20px;
        text-align: center;
      }

      .document-content {
        padding: 30px;
      }

      .document-title {
        font-size: 2em;
        font-weight: bold;
        color: #333;
        margin-bottom: 20px;
        line-height: 1.3;
      }

      .document-meta {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
        padding: 20px;
        background: #f8f9fa;
        border-radius: 10px;
      }

      .meta-item {
        display: flex;
        flex-direction: column;
      }

      .meta-label {
        font-weight: bold;
        color: #667eea;
        margin-bottom: 5px;
        font-size: 0.9em;
        text-transform: uppercase;
      }

      .meta-value {
        color: #333;
        font-size: 1.1em;
      }

      .precedent-badge {
        background: #dc3545;
        color: white;
        padding: 5px 10px;
        border-radius: 15px;
        font-size: 0.9em;
        display: inline-block;
        margin-top: 5px;
      }

      .document-section {
        margin-bottom: 30px;
      }

      .section-title {
        font-size: 1.5em;
        font-weight: bold;
        color: #667eea;
        margin-bottom: 15px;
        border-bottom: 2px solid #e9ecef;
        padding-bottom: 10px;
      }

      .section-content {
        line-height: 1.8;
        color: #333;
        font-size: 1.1em;
        text-align: justify;
      }

      .highlight-section {
        background: #fff3cd;
        border: 1px solid #ffeaa7;
        border-radius: 10px;
        padding: 20px;
        margin-top: 20px;
      }

      .highlight-title {
        font-weight: bold;
        color: #856404;
        margin-bottom: 10px;
      }

      .score-info {
        background: #d4edda;
        color: #155724;
        padding: 10px 15px;
        border-radius: 8px;
        display: inline-block;
        margin-bottom: 20px;
        font-weight: bold;
      }

      @media (max-width: 768px) {
        .header h1 {
          font-size: 1.5em;
        }

        .document-title {
          font-size: 1.5em;
        }

        .document-meta {
          grid-template-columns: 1fr;
        }

        .container {
          margin: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <a href="/" class="back-button">← Voltar</a>
        <h1>📄 Detalhes do Documento</h1>
        <p>Visualização completa do documento</p>
      </div>

      <div class="document-content" id="documentContent">
        <div class="loading">Carregando documento...</div>
      </div>
    </div>

    <script>
      const docId = '{{ doc_id }}';

      // Carregar documento ao carregar a página
      document.addEventListener('DOMContentLoaded', function () {
        loadDocument();
      });

      // Função para carregar o documento
      async function loadDocument() {
        try {
          const response = await fetch(`/api/document/${docId}`);
          const data = await response.json();

          if (response.ok) {
            displayDocument(data);
          } else {
            displayError(data.error || 'Erro ao carregar documento');
          }
        } catch (error) {
          displayError('Erro de conexão: ' + error.message);
        }
      }

      // Função para exibir o documento
      function displayDocument(doc) {
        const contentDiv = document.getElementById('documentContent');

        const metaHTML = `
                <div class="document-meta">
                    <div class="meta-item">
                        <span class="meta-label">ID do Documento</span>
                        <span class="meta-value">${doc.id}</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Score de Relevância</span>
                        <span class="meta-value">${
                          doc.score ? doc.score.toFixed(3) : 'N/A'
                        }</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Tribunal</span>
                        <span class="meta-value">${
                          doc.court || 'Não informado'
                        }</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Grau</span>
                        <span class="meta-value">${
                          doc.degree || 'Não informado'
                        }</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Data</span>
                        <span class="meta-value">${
                          doc.date || 'Não informada'
                        }</span>
                    </div>
                    ${
                      doc.is_mandatory_precedent
                        ? '<div class="meta-item"><span class="meta-label">Tipo</span><span class="precedent-badge">Precedente Obrigatório</span></div>'
                        : ''
                    }
                </div>
            `;

        const titleHTML = `
                <div class="document-section">
                    <div class="section-title">Título</div>
                    <div class="section-content">${escapeHtml(
                      doc.title || 'Sem título'
                    )}</div>
                </div>
            `;

        const bodyHTML = `
                <div class="document-section">
                    <div class="section-title">Conteúdo</div>
                    <div class="section-content">${escapeHtml(
                      doc.body || 'Conteúdo não disponível'
                    )}</div>
                </div>
            `;

        const highlightHTML = doc.highlight
          ? `
                <div class="document-section">
                    <div class="section-title">Destaque</div>
                    <div class="highlight-section">
                        <div class="highlight-title">Informações em Destaque:</div>
                        <div class="section-content">${escapeHtml(
                          doc.highlight
                        )}</div>
                    </div>
                </div>
            `
          : '';

        contentDiv.innerHTML = metaHTML + titleHTML + bodyHTML + highlightHTML;
      }

      // Função para exibir erro
      function displayError(message) {
        const contentDiv = document.getElementById('documentContent');
        contentDiv.innerHTML = `<div class="error">${escapeHtml(
          message
        )}</div>`;
      }

      // Função para escapar HTML
      function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    </script>
  </body>
</html>
