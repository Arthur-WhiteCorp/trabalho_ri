<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalhes do Documento</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #f8f9fa;
        min-height: 100vh;
        color: #333;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      .header {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 30px;
        margin-bottom: 30px;
        position: relative;
      }

      .back-button {
        position: absolute;
        top: 20px;
        left: 20px;
        background: #3498db;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 25px;
        cursor: pointer;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .back-button:hover {
        background: #2980b9;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
      }

      .back-icon {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      .header h1 {
        font-size: 2em;
        font-weight: 300;
        color: #2c3e50;
        margin-bottom: 10px;
        text-align: center;
      }

      .header p {
        font-size: 1.1em;
        color: #7f8c8d;
        font-weight: 300;
        text-align: center;
      }

      .loading {
        text-align: center;
        padding: 80px 20px;
        color: #6c757d;
        font-size: 1.2em;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      .error {
        background: #f8d7da;
        color: #721c24;
        padding: 25px;
        border-radius: 15px;
        margin: 20px 0;
        text-align: center;
        border: 1px solid #f5c6cb;
        font-size: 1.1em;
      }

      .document-content {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 40px;
        margin-bottom: 30px;
      }

      .document-title {
        font-size: 1.8em;
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 25px;
        line-height: 1.4;
      }

      .document-meta {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 35px;
        padding: 25px;
        background: #f8f9fa;
        border-radius: 15px;
        border: 1px solid #e9ecef;
      }

      .meta-item {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .meta-label {
        font-weight: 600;
        color: #3498db;
        font-size: 0.9em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .meta-value {
        color: #2c3e50;
        font-size: 1.1em;
        font-weight: 500;
      }

      .precedent-badge {
        background: #e74c3c;
        color: white;
        padding: 6px 12px;
        border-radius: 15px;
        font-size: 0.85em;
        font-weight: 600;
        display: inline-block;
        margin-top: 5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .document-section {
        margin-bottom: 35px;
      }

      .section-title {
        font-size: 1.4em;
        font-weight: 600;
        color: #3498db;
        margin-bottom: 20px;
        border-bottom: 2px solid #e9ecef;
        padding-bottom: 12px;
        position: relative;
      }

      .section-title::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 60px;
        height: 2px;
        background: #3498db;
      }

      .section-content {
        line-height: 1.8;
        color: #2c3e50;
        font-size: 1.05em;
        text-align: justify;
        background: #f8f9fa;
        padding: 25px;
        border-radius: 15px;
        border: 1px solid #e9ecef;
      }

      .highlight-section {
        background: #e8f4fd;
        border: 1px solid #b3d9ff;
        border-radius: 15px;
        padding: 25px;
        margin-top: 20px;
      }

      .highlight-title {
        font-weight: 600;
        color: #2980b9;
        margin-bottom: 15px;
        font-size: 1.1em;
      }

      .score-info {
        background: #d4edda;
        color: #155724;
        padding: 12px 20px;
        border-radius: 25px;
        display: inline-block;
        margin-bottom: 25px;
        font-weight: 600;
        font-size: 0.95em;
        border: 1px solid #c3e6cb;
      }

      @media (max-width: 768px) {
        .container {
          padding: 20px 15px;
        }

        .header {
          padding: 25px 20px;
        }

        .header h1 {
          font-size: 1.6em;
          margin-top: 20px;
        }

        .back-button {
          position: relative;
          top: auto;
          left: auto;
          margin-bottom: 20px;
          align-self: flex-start;
        }

        .document-content {
          padding: 25px 20px;
        }

        .document-title {
          font-size: 1.5em;
        }

        .document-meta {
          grid-template-columns: 1fr;
          padding: 20px;
        }

        .section-content {
          padding: 20px;
          font-size: 1em;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <a href="/" class="back-button">
          <svg class="back-icon" viewBox="0 0 24 24">
            <path
              d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
            />
          </svg>
          Voltar
        </a>
        <h1>📄 Detalhes do Documento</h1>
        <p>Visualização completa do documento</p>
      </div>

      <div class="document-content" id="documentContent">
        <div class="loading">Carregando documento...</div>
      </div>
    </div>

    <script>
      const docId = '{{ doc_id }}';

      // Carregar documento ao carregar a página
      document.addEventListener('DOMContentLoaded', function () {
        loadDocument();
      });

      // Função para carregar o documento
      async function loadDocument() {
        try {
          const response = await fetch(`/api/document/${docId}`);
          const data = await response.json();

          if (response.ok) {
            displayDocument(data);
          } else {
            displayError(data.error || 'Erro ao carregar documento');
          }
        } catch (error) {
          displayError('Erro de conexão: ' + error.message);
        }
      }

      // Função para exibir o documento
      function displayDocument(doc) {
        const contentDiv = document.getElementById('documentContent');

        const metaHTML = `
          <div class="document-meta">
            <div class="meta-item">
              <span class="meta-label">ID do Documento</span>
              <span class="meta-value">${doc.id}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Score de Relevância</span>
              <span class="meta-value">${
                doc.score ? doc.score.toFixed(3) : 'N/A'
              }</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Tribunal</span>
              <span class="meta-value">${doc.court || 'Não informado'}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Grau</span>
              <span class="meta-value">${doc.degree || 'Não informado'}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Data</span>
              <span class="meta-value">${doc.date || 'Não informada'}</span>
            </div>
            ${
              doc.is_mandatory_precedent
                ? '<div class="meta-item"><span class="meta-label">Tipo</span><span class="precedent-badge">Precedente Obrigatório</span></div>'
                : ''
            }
          </div>
        `;

        const titleHTML = `
          <div class="document-section">
            <div class="section-title">Título</div>
            <div class="section-content">${escapeHtml(
              doc.title || 'Sem título'
            )}</div>
          </div>
        `;

        const bodyHTML = `
          <div class="document-section">
            <div class="section-title">Conteúdo</div>
            <div class="section-content">${escapeHtml(
              doc.body || 'Conteúdo não disponível'
            )}</div>
          </div>
        `;

        const highlightHTML = doc.highlight
          ? `
          <div class="document-section">
            <div class="section-title">Destaque</div>
            <div class="highlight-section">
              <div class="highlight-title">Informações em Destaque:</div>
              <div class="section-content" style="background: transparent; padding: 0; border: none;">${escapeHtml(
                doc.highlight
              )}</div>
            </div>
          </div>
        `
          : '';

        contentDiv.innerHTML = metaHTML + titleHTML + bodyHTML + highlightHTML;
      }

      // Função para exibir erro
      function displayError(message) {
        const contentDiv = document.getElementById('documentContent');
        contentDiv.innerHTML = `<div class="error">${escapeHtml(
          message
        )}</div>`;
      }

      // Função para escapar HTML
      function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    </script>
  </body>
</html>
