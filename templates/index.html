<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Busca de Documentos</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #f8f9fa;
        min-height: 100vh;
        color: #333;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      .header {
        text-align: center;
        margin-bottom: 60px;
      }

      .header h1 {
        font-size: 2.5em;
        font-weight: 300;
        color: #2c3e50;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 1.1em;
        color: #7f8c8d;
        font-weight: 300;
      }

      .search-container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 40px;
        margin-bottom: 40px;
      }

      .search-form {
        display: flex;
        gap: 15px;
        align-items: center;
        max-width: 600px;
        margin: 0 auto;
      }

      .search-input {
        flex: 1;
        padding: 18px 25px;
        border: 2px solid #e9ecef;
        border-radius: 50px;
        font-size: 16px;
        transition: all 0.3s ease;
        background: #f8f9fa;
      }

      .search-input:focus {
        outline: none;
        border-color: #3498db;
        background: white;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
      }

      .search-button {
        background: #3498db;
        color: white;
        border: none;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
      }

      .search-button:hover {
        background: #2980b9;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
      }

      .search-button:disabled {
        background: #bdc3c7;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .search-icon {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }

      .advanced-options {
        margin-top: 20px;
        padding: 20px;
        background: #f8f9fa;
        border-radius: 15px;
        border: 1px solid #e9ecef;
      }

      .advanced-options label {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        font-size: 14px;
        color: #6c757d;
      }

      .advanced-options input[type='checkbox'] {
        width: 16px;
        height: 16px;
        accent-color: #3498db;
      }

      .expansion-info {
        margin-top: 10px;
        padding: 10px;
        background: #e8f4fd;
        border-radius: 8px;
        font-size: 14px;
        color: #2980b9;
        display: none;
      }

      .results-section {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 40px;
        margin-top: 30px;
      }

      .results-header {
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px solid #e9ecef;
      }

      .results-count {
        font-size: 1.1em;
        color: #6c757d;
        font-weight: 500;
      }

      .loading {
        text-align: center;
        padding: 60px 20px;
        color: #6c757d;
        font-size: 1.1em;
      }

      .error {
        background: #f8d7da;
        color: #721c24;
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 20px;
        border: 1px solid #f5c6cb;
      }

      .result-card {
        background: #f8f9fa;
        border: 1px solid #e9ecef;
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 20px;
        transition: all 0.3s ease;
      }

      .result-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        border-color: #3498db;
      }

      .result-title {
        font-size: 1.3em;
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 12px;
      }

      .result-title a {
        color: #3498db;
        text-decoration: none;
        transition: color 0.3s;
      }

      .result-title a:hover {
        color: #2980b9;
        text-decoration: underline;
      }

      .result-score {
        background: #27ae60;
        color: white;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.85em;
        display: inline-block;
        margin-bottom: 15px;
        font-weight: 500;
      }

      .result-body {
        color: #555;
        line-height: 1.6;
        margin-bottom: 15px;
        font-size: 0.95em;
      }

      .result-meta {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        font-size: 0.9em;
        color: #6c757d;
        padding-top: 15px;
        border-top: 1px solid #e9ecef;
      }

      .meta-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .meta-label {
        font-weight: 600;
        color: #495057;
      }

      .precedent-badge {
        background: #e74c3c;
        color: white;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.8em;
        font-weight: 500;
      }

      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 40px;
        padding-top: 30px;
        border-top: 1px solid #e9ecef;
      }

      .pagination button {
        padding: 12px 24px;
        background: #3498db;
        color: white;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
      }

      .pagination button:hover:not(:disabled) {
        background: #2980b9;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
      }

      .pagination button:disabled {
        background: #bdc3c7;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .page-info {
        font-size: 16px;
        color: #495057;
        font-weight: 500;
        padding: 12px 24px;
        background: #f8f9fa;
        border-radius: 25px;
        min-width: 140px;
        text-align: center;
      }

      .showing-info {
        font-size: 14px;
        color: #6c757d;
        background: #e9ecef;
        padding: 8px 16px;
        border-radius: 20px;
        display: inline-block;
        margin-top: 15px;
      }

      @media (max-width: 768px) {
        .container {
          padding: 20px 15px;
        }

        .header h1 {
          font-size: 2em;
        }

        .search-container {
          padding: 30px 20px;
        }

        .search-form {
          flex-direction: column;
          gap: 20px;
        }

        .search-input {
          width: 100%;
        }

        .search-button {
          width: 50px;
          height: 50px;
        }

        .results-section {
          padding: 30px 20px;
        }

        .pagination {
          flex-direction: column;
          gap: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Searcher</h1>
        <p>Encontre documentos jurídicos de forma rápida e eficiente</p>
      </div>

      <div class="search-container">
        <form class="search-form" id="searchForm">
          <input
            type="text"
            class="search-input"
            id="queryInput"
            placeholder="Digite sua busca..."
            required
          />
          <button type="submit" class="search-button" id="searchButton">
            <svg class="search-icon" viewBox="0 0 24 24">
              <path
                d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
              />
            </svg>
          </button>
        </form>

        <div class="advanced-options">
          <label>
            <input type="checkbox" id="useLocalExpansion" checked />
            <span>Usar expansão local (feedback implícito)</span>
          </label>
          <div id="expansionInfo" class="expansion-info">
            <strong>Expansão aplicada:</strong>
            <span id="expansionText"></span>
          </div>
        </div>
      </div>

      <div class="results-section" id="resultsSection" style="display: none">
        <div class="results-header">
          <div class="results-count" id="resultsCount"></div>
        </div>
        <div id="results"></div>

        <div id="pagination" class="pagination" style="display: none">
          <button id="prevPage">← Anterior</button>
          <div id="pageInfo" class="page-info"></div>
          <button id="nextPage">Próximo →</button>
          <div id="showingInfo" class="showing-info"></div>
        </div>
      </div>
    </div>

    <script>
      // Variáveis globais para paginação
      let currentPage = 1;
      let totalPages = 1;
      let currentQuery = '';
      let currentSize = 10;
      let totalResults = 0;

      // Função para executar busca
      async function performSearch(query, size = 10, page = 1) {
        const searchButton = document.getElementById('searchButton');
        const resultsSection = document.getElementById('resultsSection');
        const resultsDiv = document.getElementById('results');

        searchButton.disabled = true;
        resultsSection.style.display = 'block';
        resultsDiv.innerHTML =
          '<div class="loading">Buscando documentos...</div>';

        try {
          const useLocalExpansion =
            document.getElementById('useLocalExpansion').checked;

          const response = await fetch('/search', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              query: query,
              field: 'all',
              size: size,
              page: page,
              use_local_expansion: useLocalExpansion,
            }),
          });

          const data = await response.json();

          if (response.ok) {
            currentPage = data.pagination.current_page;
            totalPages = data.pagination.total_pages;
            currentQuery = query;
            currentSize = size;
            totalResults = data.total;

            displayResults(data);
            updatePagination();
            displayExpansionInfo(data);
          } else {
            displayError(data.error || 'Erro na busca');
          }
        } catch (error) {
          displayError('Erro de conexão: ' + error.message);
        } finally {
          searchButton.disabled = false;
        }
      }

      // Função para exibir informações sobre expansão local
      function displayExpansionInfo(data) {
        const expansionInfo = document.getElementById('expansionInfo');
        const expansionText = document.getElementById('expansionText');

        if (data.expansion_info && data.expansion_info.expansion_applied) {
          const localTerms = data.expansion_info.local_expansion_terms || [];
          if (localTerms && localTerms.length > 0) {
            expansionText.textContent = `"${localTerms.join('", "')}"`;
            expansionInfo.style.display = 'block';
          } else {
            expansionInfo.style.display = 'none';
          }
        } else {
          expansionInfo.style.display = 'none';
        }
      }

      // Função para navegar para página anterior
      function goToPreviousPage() {
        if (currentPage > 1) {
          performSearch(currentQuery, currentSize, currentPage - 1);
        }
      }

      // Função para navegar para próxima página
      function goToNextPage() {
        if (currentPage < totalPages) {
          performSearch(currentQuery, currentSize, currentPage + 1);
        }
      }

      // Função para atualizar controles de paginação
      function updatePagination() {
        const paginationDiv = document.getElementById('pagination');
        const prevButton = document.getElementById('prevPage');
        const nextButton = document.getElementById('nextPage');
        const pageInfo = document.getElementById('pageInfo');
        const showingInfo = document.getElementById('showingInfo');

        if (totalPages <= 1) {
          paginationDiv.style.display = 'none';
          return;
        }

        paginationDiv.style.display = 'flex';
        prevButton.disabled = currentPage <= 1;
        nextButton.disabled = currentPage >= totalPages;
        pageInfo.textContent = `Página ${currentPage} de ${totalPages}`;

        const from = (currentPage - 1) * currentSize + 1;
        const to = Math.min(currentPage * currentSize, totalResults);
        showingInfo.textContent = `Mostrando ${from} a ${to} de ${totalResults} resultados`;
      }

      // Função para exibir resultados
      function displayResults(data) {
        const resultsDiv = document.getElementById('results');
        const resultsCount = document.getElementById('resultsCount');

        resultsCount.textContent = `${data.total} resultado(s) encontrado(s)`;

        if (data.results.length === 0) {
          resultsDiv.innerHTML =
            '<div class="loading">Nenhum resultado encontrado</div>';
          return;
        }

        const resultsHTML = data.results
          .map(
            (result) => `
            <div class="result-card">
                <div class="result-title">
                    <a href="/document/${result.id}">
                        ${escapeHtml(result.title)}
                    </a>
                </div>
                <div class="result-score">Score: ${result.score.toFixed(
                  3
                )}</div>
                <div class="result-body">${escapeHtml(result.body)}</div>
                <div class="result-meta">
                    <div class="meta-item">
                        <span class="meta-label">ID:</span>
                        <span>${result.id}</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Tribunal:</span>
                        <span>${result.court || 'N/A'}</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Grau:</span>
                        <span>${result.degree || 'N/A'}</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Data:</span>
                        <span>${result.date || 'N/A'}</span>
                    </div>
                    ${
                      result.is_mandatory_precedent
                        ? '<div class="meta-item"><span class="precedent-badge">Precedente Obrigatório</span></div>'
                        : ''
                    }
                </div>
            </div>
        `
          )
          .join('');

        resultsDiv.innerHTML = resultsHTML;
      }

      // Função para exibir erro
      function displayError(message) {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = `<div class="error">${escapeHtml(
          message
        )}</div>`;
        document.getElementById('resultsCount').textContent = '';
        document.getElementById('pagination').style.display = 'none';
      }

      // Função para escapar HTML
      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Event listener para o formulário de busca
      document
        .getElementById('searchForm')
        .addEventListener('submit', function (e) {
          e.preventDefault();

          const query = document.getElementById('queryInput').value.trim();
          if (query) {
            currentPage = 1;
            performSearch(query, 10, 1);
          }
        });

      // Event listeners para paginação
      document
        .getElementById('prevPage')
        .addEventListener('click', goToPreviousPage);
      document
        .getElementById('nextPage')
        .addEventListener('click', goToNextPage);
    </script>
  </body>
</html>
